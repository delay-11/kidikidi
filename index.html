<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>시안 제작</title>

    <link rel="stylesheet" href="./css/index.css" />

    <!-- favicon -->
    <link rel="icon" type="image/png" href="./image/favicon.png">

    <!-- Pickr (커스텀 컬러피커) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/themes/nano.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/pickr.min.js"></script>

    <!-- EmailJS -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <!-- JSZip -->
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

</head>

<body>
    <div class="wrap">
        <h1>시안 제작페이지</h1>

        <div class="layout2">
            <!-- LEFT -->
            <div class="leftStack">
                <section class="card">
                    <div class="row1">
                        <div class="row">
                            <div>
                                <label>주문자명 *</label>
                                <input id="name" placeholder="홍길동" />
                            </div>
                            <div>
                                <label>핸드폰번호 *</label>
                                <input id="phone" placeholder="010-1234-5678" />
                            </div>
                        </div>

                        <div class="row">
                            <div>
                                <label>주문번호 *</label>
                                <input id="orderNo" placeholder="ORD-YYYYMMDD-0001" />
                            </div>
                            <div>
                                <label>이메일 *</label>
                                <input id="email" placeholder="customer@email.com" />
                            </div>
                        </div>

                        <div class="divider"></div>

                        <!-- 견적서 요청 토글 (프로파일 위) -->
                        <div class="row1">
                            <label class="inlineCheck">
                                <input type="checkbox" id="quoteToggle" />
                                견적서 요청
                            </label>

                            <div id="quoteBox" style="display:none;">
                                <div class="row">
                                    <div>
                                        <label>제작 일정 선택 *</label>
                                        <select id="quoteProd">
                                            <option value="none">일반 제작</option>
                                            <option value="10d">빠른제작(+20%) / 영업일 10일내 출고</option>
                                            <option value="5d">긴급제작(+30%) / 영업일 5일내 출고</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label>희망 납기일 *</label>
                                        <input id="quoteDue" type="date" />
                                    </div>
                                </div>

                                <div style="margin-top:12px;">
                                    <label>사업자등록증 업로드 *</label>
                                    <div class="fileUpload">
                                        <input id="bizFile" type="file" accept="image/*,.pdf" hidden />
                                        <button type="button" id="bizFileBtn" class="ghostBtn">파일 선택</button>
                                        <span id="bizFileName" class="fileName">선택된 파일 없음</span>
                                    </div>
                                </div>

                                <div class="divider"></div>

                                <!-- [ADD] 키캡 키링 옵션 -->
                                <div class="row">
                                    <div>
                                        <label>키캡 키링 수량</label>
                                        <input id="keyringQty" type="number" min="0" value="0" />
                                    </div>
                                    <div>
                                        <label>LED 유무</label>
                                        <select id="keyringLed">
                                            <option value="none">선택 안 함</option>
                                            <option value="yes">있음</option>
                                            <option value="no">없음</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="row">
                                    <div>
                                        <label>키링 색상</label>
                                        <select id="keyringColor">
                                            <option value="black">블랙</option>
                                            <option value="white">화이트</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label>키링 종류</label>
                                        <select id="keyringSlots">
                                            <option value="1">1구</option>
                                            <option value="2">2구</option>
                                            <option value="3">3구</option>
                                            <option value="4">4구</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="divider"></div>

                                <!-- [ADD] 포장 요구사항 -->
                                <div class="row">
                                    <div>
                                        <label>포장 요구사항</label>
                                        <select id="packType">
                                            <option value="none">선택 안 함</option>
                                            <option value="opp">개별 OPP 포장</option>
                                            <option value="byDesign">각 시안별 묶음 포장</option>
                                            <option value="set">세트 포장</option>
                                            <option value="case">케이스 제작</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label>추가 옵션</label>
                                        <div class="row1">
                                            <label class="inlineCheck" style="margin:0;">
                                                <input type="checkbox" id="packSheet" />
                                                대지 포함
                                            </label>
                                            <label class="inlineCheck" style="margin:0;">
                                                <input type="checkbox" id="packSticker" />
                                                스티커 제작
                                            </label>
                                        </div>
                                    </div>
                                </div>

                                <div style="margin-top:12px;">
                                    <label>기타 유의사항</label>
                                    <textarea id="quoteNotes" rows="4"
                                        style="width:100%; border-radius:12px; border:1px solid var(--line); padding:10px 12px; font-size:14px; outline:none;"
                                        placeholder="예) 포장 시 주의사항 / 구성 관련 요청 / 참고사항 등"></textarea>
                                </div>

                                <div class="divider"></div>
                            </div>
                        </div>

                        <div class="row">
                            <div>
                                <label class="labelWithHelp">
                                    키캡 프로파일 *
                                    <span class="helpWrap">
                                        <button type="button" class="helpIcon" data-help="profile"
                                            aria-label="키캡 프로파일 안내">?</button>
                                        <div class="helpTooltip" data-help-tooltip="profile"></div>
                                    </span>
                                </label>
                                <select id="profile">
                                    <option value="OEM">OEM</option>
                                    <option value="XDA">XDA</option>
                                    <option value="MAO">MAO</option>
                                </select>
                            </div>
                            <div>
                                <label class="labelWithHelp">
                                    키캡 규격 *
                                    <span class="helpWrap">
                                        <button type="button" class="helpIcon" data-help="capType"
                                            aria-label="키캡 규격 안내">?</button>
                                        <div class="helpTooltip" data-help-tooltip="capType"></div>
                                    </span>
                                </label>
                                <select id="capType"></select>
                            </div>
                        </div>

                        <div class="row">
                            <div>
                                <label>레이저 각인 (OEM)</label>
                                <select id="laser">
                                    <option value="none">없음</option>
                                    <option value="black">블랙 (+800)</option>
                                    <option value="white">화이트 (+1,800)</option>
                                </select>
                            </div>
                            <div>
                                <label>수량 *</label>
                                <input id="qty" type="number" min="1" value="1" />
                            </div>
                        </div>

                        <div class="btns">
                            <button id="btnAddItem" type="button">시안 추가</button>
                        </div>

                    </div>
                </section>
            </div>

            <!-- RIGHT -->
            <div class="rightStack">
                <section class="card">
                    <div class="editorWrap">
                        <!-- 캔버스 영역 -->
                        <div class="canvasFrame">
                            <div class="pill">
                                <span class="tag">선택 프로파일/규격</span><b id="selText">없음</b>
                                <span class="tag">캔버스</span><b id="canvasText">-</b>
                                <span class="tag">배경</span><b id="bgText">-</b>
                            </div>

                            <div class="divider"></div>

                            <div id="canvasWrap" class="canvasWrap">
                                <canvas id="designCanvas" width="330" height="330"></canvas>

                                <div id="bbox" class="bbox">
                                    <div class="rotLine"></div>
                                    <div class="rot" id="rotHandle" title="회전"></div>
                                    <div class="h nw" data-h="nw"></div>
                                    <div class="h ne" data-h="ne"></div>
                                    <div class="h sw" data-h="sw"></div>
                                    <div class="h se" data-h="se"></div>
                                </div>
                            </div>

                            <div class="divider"></div>

                            <div class="row">
                                <div>
                                    <label>선택 아이템에 이미지 업로드 *</label>
                                    <div class="fileUpload">
                                        <input id="file" type="file" accept="image/*" hidden />
                                        <button type="button" id="fileBtn" class="ghostBtn">이미지 선택하기</button>
                                        <button type="button" id="fileDelBtn" class="dangerBtn">삭제</button>
                                        <span id="fileName" class="fileName">선택된 파일 없음</span>
                                    </div>
                                </div>

                                <div>
                                    <label>배경 색상 선택</label>
                                    <div class="colorPick">
                                        <button type="button" id="bgPickBtn" class="ghostBtn">배경색 선택</button>
                                        <span class="colorSwatch" id="bgColorSwatch" aria-hidden="true"></span>
                                        <span class="colorValue" id="bgColorValue">#ffffff</span>
                                        <span id="bgPickMount" class="pickrMount"></span>
                                    </div>
                                </div>
                            </div>

                            <div class="divider"></div>

                            <div class="hint">
                                - 가이드 색상: <b class="red">빨강=바깥선</b>, <b class="yellow">노랑=인쇄 안전선</b><br />
                                - 실제 제작은 <b>CMYK</b> 색상으로 제작됩니다.
                            </div>

                            <div class="divider"></div>

                            <div class="pill">
                                <span class="tag">조작</span>
                                <b>드래그 이동</b>
                                <span> | </span>
                                <span class="tag">크기</span>
                                <b>모서리 핸들</b>
                                <span> | </span>
                                <span class="tag">Alt</span>
                                <b>중심 확대</b>
                                <span> | </span>
                                <span class="tag">회전</span>
                                <b>상단 핸들</b>
                            </div>
                        </div>

                        <!-- 장바구니 영역 -->
                        <div class="canvasFrame">
                            <div id="cartList" class="cartList"></div>

                            <br>

                            <div class="btns">
                                <button id="btnConfirm" type="button" class="confirmBtn">시안 확정하기</button>
                            </div>

                            <div class="divider"></div>

                            <div class="pill">
                                <span class="tag">장바구니</span><b id="cartCount">0</b>개
                                <span class="tag">총액</span><b id="cartTotal">0원</b>
                            </div>

                            <br>

                            <div class="hint">
                                * 배송비 미포함
                            </div>

                            <div id="msg" class="warn"></div>
                            <div id="ok" class="ok"></div>

                        </div>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <script src="./js/index.js"></script>
</body>

</html>
