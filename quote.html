<!doctype html>
<html lang="ko">

<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>키캡 견적 요청 시스템</title>

    <!-- favicon -->
    <link rel="icon" type="image/png" href="./image/favicon.png">

    <!-- Pickr (커스텀 컬러피커) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/themes/nano.min.css" />

    <!-- CSS -->
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/layout.css" />
    <link rel="stylesheet" href="./css/form.css" />
    <link rel="stylesheet" href="./css/components-tooltip.css" />
    <link rel="stylesheet" href="./css/components-ui.css" />
    <link rel="stylesheet" href="./css/modal.css" />
    <link rel="stylesheet" href="./css/canvas.css" />
    <link rel="stylesheet" href="./css/cart.css" />
    <link rel="stylesheet" href="./css/color-picker.css" />
    <link rel="stylesheet" href="./css/responsive.css" />

    <!-- Pickr JS -->
    <script src="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/pickr.min.js"></script>

    <!-- EmailJS -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <!-- JSZip -->
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>

<body>

    <!-- HEADER -->
    <header class="siteHeader">
        <div class="headerInner">

            <div class="headerBrand">
                <img src="./image/favicon.png" class="headerLogo" alt="KidiKidi">
                <span class="systemName">키캡 견적 요청 시스템</span>
            </div>

            <div class="headerVersion">
                v1.0
            </div>

        </div>
    </header>

    <!-- ORDER BAR -->
    <div class="orderBar">
        <div class="orderInner">
            <div class="orderLine">
                <span class="orderLabel">견적 요청</span>
                <span id="orderBarNo" class="orderNumber">옵션 입력 후 견적 요청</span>
            </div>
        </div>
    </div>

    <div class="wrap">
        <div class="layout2">

            <!-- LEFT -->
            <div class="leftStack">
                <section class="card">
                    <div class="row1">
                        <div class="row">
                            <div>
                                <label>주문자명 *</label>
                                <input id="name" placeholder="홍길동" />
                            </div>
                            <div>
                                <label>핸드폰번호 *</label>
                                <input id="phone" placeholder="010-1234-5678" />
                            </div>
                        </div>

                        <div class="row">
                            <div>
                                <label id="orderLabel">주문번호 (선택)</label>
                                <input id="orderNo" placeholder="주문번호 16자리 (있는 경우 입력)" />
                            </div>
                            <div>
                                <label>이메일 *</label>
                                <input id="email" placeholder="customer@email.com" />
                            </div>
                        </div>

                        <div class="divider"></div>

                        <div class="row">
                            <div>
                                <label class="labelWithHelp">
                                    키캡 프로파일 *
                                    <span class="helpWrap">
                                        <button type="button" class="helpIcon" data-help="profile"
                                            aria-label="키캡 프로파일 안내">?</button>
                                        <div class="helpTooltip" data-help-tooltip="profile"></div>
                                    </span>
                                </label>
                                <select id="profile">
                                    <option value="OEM">OEM</option>
                                    <option value="XDA">XDA</option>
                                    <option value="MAO">MAO</option>
                                </select>
                            </div>
                            <div>
                                <label class="labelWithHelp">
                                    키캡 규격 *
                                    <span class="helpWrap">
                                        <button type="button" class="helpIcon" data-help="capType"
                                            aria-label="키캡 규격 안내">?</button>
                                        <div class="helpTooltip" data-help-tooltip="capType"></div>
                                    </span>
                                </label>
                                <select id="capType"></select>
                            </div>
                        </div>

                        <div class="row">
                            <div>
                                <label>레이저 각인 (OEM)</label>
                                <select id="laser">
                                    <option value="none">없음</option>
                                    <option value="black">블랙</option>
                                    <option value="white">화이트</option>
                                </select>
                            </div>
                            <div>
                                <label>수량 *</label>
                                <input id="qty" type="number" min="1" value="1" />
                            </div>
                        </div>

                        <div class="divider"></div>

                        <div class="row">
                            <div>
                                <label>제작 일정 선택 *</label>
                                <select id="quoteProd">
                                    <option value="none">일반 제작</option>
                                    <option value="10d">빠른제작(+20%) / 영업일 10일내 출고</option>
                                    <option value="5d">긴급제작(+30%) / 영업일 5일내 출고</option>
                                </select>
                            </div>
                            <div>
                                <label>희망 납기일 *</label>
                                <input id="quoteDue" type="date" />
                            </div>
                        </div>

                        <div style="margin-top:12px;">
                            <label>사업자등록증 업로드 *</label>
                            <div class="fileUpload">
                                <input id="bizFile" type="file" accept="image/*,.pdf" hidden />
                                <button type="button" id="bizFileBtn" class="ghostBtn">파일 선택</button>
                                <span id="bizFileName" class="fileName">선택된 파일 없음</span>
                            </div>
                        </div>

                        <div class="divider"></div>

                        <div class="row">
                            <div>
                                <label>키캡 키링 수량</label>
                                <input id="keyringQty" type="number" min="0" value="0" />
                            </div>
                            <div>
                                <label>LED 유무</label>
                                <select id="keyringLed">
                                    <option value="none">선택 안 함</option>
                                    <option value="yes">있음</option>
                                    <option value="no">없음</option>
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <div>
                                <label>키링 색상</label>
                                <select id="keyringColor">
                                    <option value="white">투명</option>
                                    <option value="black">블랙</option>
                                </select>
                            </div>
                            <div>
                                <label>키링 종류</label>
                                <select id="keyringSlots">
                                    <option value="1">1구</option>
                                    <option value="2">2구</option>
                                    <option value="3">3구</option>
                                    <option value="4">4구</option>
                                </select>
                            </div>
                        </div>

                        <div class="divider"></div>

                        <div class="row">
                            <div>
                                <label>포장 요구사항</label>
                                <select id="packType">
                                    <option value="none">선택 안 함</option>
                                    <option value="opp">개별 OPP 포장</option>
                                    <option value="byDesign">각 시안별 묶음 포장</option>
                                    <option value="set">세트 포장</option>
                                    <option value="case">케이스 제작</option>
                                </select>
                            </div>
                            <div>
                                <label>추가 옵션</label>
                                <div class="row1">
                                    <label class="inlineCheck" style="margin:0;">
                                        <input type="checkbox" id="packSheet" />
                                        대지 포함
                                    </label>
                                    <label class="inlineCheck" style="margin:0;">
                                        <input type="checkbox" id="packSticker" />
                                        스티커 제작
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div style="margin-top:12px;">
                            <label>기타 유의사항</label>
                            <textarea id="quoteNotes" rows="4"
                                placeholder="예) 포장 시 주의사항 / 구성 관련 요청 / 참고사항 등"></textarea>
                        </div>
                    </div>
                </section>
            </div>

            <!-- RIGHT -->
            <div class="rightStack">
                <section class="card">
                    <div class="editorWrap">
                        <div class="canvasFrame">
                            <div class="pill">
                                <span class="tag">견적 요청 안내</span><b>입력하신 내용을 기준으로 견적서를 안내드립니다.</b>
                            </div>

                            <div class="divider"></div>

                            <div class="hint">
                                - 요청하신 옵션, 수량, 납기 기준으로 견적이 안내됩니다.<br />
                                - 사업자등록증 파일이 필요한 경우 함께 첨부해 주세요.<br />
                                - 주문번호가 있는 경우 함께 입력해 주세요.
                            </div>

                            <div class="divider"></div>

                            <div class="btns">
                                <button id="btnQuoteRequest" type="button" class="confirmBtn actionBtn">
                                    견적 요청하기
                                </button>
                            </div>

                            <div id="msg" class="warn"></div>
                            <div id="ok" class="ok"></div>
                        </div>
                    </div>
                </section>
            </div>

        </div>
    </div>

    <footer class="footer">
        <div class="footerInner">
            <div class="footerLeft">
                © 2026 KidiKidi. All rights reserved.
            </div>

            <div class="footerRight">
                본 제작 시스템 및 디자인 툴은 KidiKidi의 자산입니다.<br>
                무단 복제, 배포, 재사용을 금지합니다.
            </div>
        </div>
    </footer>

    <!-- JS -->
    <script src="./js/constants.js"></script>
    <script src="./js/dom.js"></script>
    <script src="./js/state-quote.js"></script>
    <script src="./js/utils.js"></script>
    <script src="./js/validation.js"></script>
    <script src="./js/tooltip.js"></script>
    <script src="./js/quote.js"></script>
    <script src="./js/email-core.js"></script>
    <script src="./js/email-send-quote.js"></script>
    <script src="./js/quote-app.js"></script>

</body>

</html>
